name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  STANDARD_USER: ${{ secrets.STANDARD_USER }}
  TTA_SECRET: ${{ secrets.TTA_SECRET }}
  CHECKOUT_ITEM_ID: ${{ secrets.CHECKOUT_ITEM_ID }}
  CHECKOUT_FIRST_NAME: ${{ secrets.CHECKOUT_FIRST_NAME }}
  CHECKOUT_LAST_NAME: ${{ secrets.CHECKOUT_LAST_NAME }}
  CHECKOUT_POSTAL_CODE: ${{ secrets.CHECKOUT_POSTAL_CODE }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
