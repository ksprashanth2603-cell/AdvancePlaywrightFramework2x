name: PR Quality Gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-attestation:
    name: Required gate checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate PR quality gate results
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/validate-quality-gates.mjs